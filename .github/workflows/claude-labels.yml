# CREATE LABELS: creates or updates all labels of the Claude automation.
# Start: by hand under Actions → "Claude – Create labels" → Run workflow.
# Running it more than once does no harm: existing labels get the color and
# description from here (--force), issues keep their labels.
name: Claude – Create labels

on:
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write # to create and change labels
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or update labels
        run: |
          # mk <name> <color (hex without #)> <description (max. 100 characters)>
          mk() { gh label create "$1" --color "$2" --description "$3" --force; }

          # Start labels (set by a human or the chat)
          mk "claude:auto-architect"   "5319e7" "High-class Claude model works on it automatically"
          mk "claude:auto-implement"   "1f883d" "Low-class Claude model works on it automatically"
          mk "claude:queued"           "bfdadc" "Waiting for other issues (Depends on #…)"

          # Status labels (set by the workflows)
          mk "claude:in-progress"      "fbca04" "Claude is working on it"
          mk "claude:pr-open"          "0e8a16" "Pull request open – please review"
          mk "claude:failed"           "b60205" "Automatic implementation failed"

          # Human needed
          mk "needs-human"             "d93f0b" "A human must do or decide something"
          mk "needs-human:access"      "f9d0c4" "Access, secrets or infrastructure needed"
          mk "needs-human:decision"    "f9d0c4" "Open decision (product/UX/architecture)"
          mk "needs-human:manual-test" "f9d0c4" "Can only be checked by hand"
          mk "needs-human:risky"       "f9d0c4" "Risky change – a human should decide"
