# ARCHITECT (Opus): analyze a task and split it into concrete implement issues. Writes no code.
# Start: label "claude:auto-architect".
# Issues that can be implemented are handed to claude-implement.yml directly. Its dependency check
# sets issues with open "Depends on #…" to "claude:queued" automatically.
# Second job "unlock": when an issue is closed, it starts waiting issues whose dependencies are done.
name: Claude – Architect (Opus)

on:
  issues:
    types: [labeled, closed] # start when an issue is labeled or closed (for unlock)
  workflow_dispatch: # manual run: check waiting issues

jobs:
  architect:
    # The architect job starts only when an issue gets the label claude:auto-architect
    if: github.event.action == 'labeled' && github.event.label.name == 'claude:auto-architect'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # One group per issue, so two runs never work on the same issue at the same time
      group: claude-architect-${{ github.event.issue.number }}
      # If a second run comes in for the group, the running one is not cancelled
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write # to start claude-implement.yml
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # This step changes the label from claude:auto-architect to claude:in-progress
      - name: Status → in progress
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --add-label "claude:in-progress" || true
          gh issue edit "$ISSUE" --remove-label "claude:failed,needs-human" || true

      # This step analyzes the issue with Claude Opus and creates sub-issues.
      # The result is a fixed JSON (stored in $RESULT) that lists the created issues.
      - name: Claude designs and creates issues
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ env.ISSUE }}

            You are a software architect. Issue #${{ env.ISSUE }} describes a larger task.
            Split it into implement issues that another model can do WITHOUT asking questions.
            You write NO code and do not change any files in the repo.
            Write all issues and comments in simple English (CLAUDE.md rule 1).

            The functional requirement was agreed with the human beforehand (goal, scope,
            acceptance criteria). Treat it as fixed. Your job is the technical HOW.

            1. Read the issue: `gh issue view ${{ env.ISSUE }} --comments`
               If it points to files (e.g. under docs/), read them too.
            2. Read CLAUDE.md and study the relevant code carefully (Glob, Grep, Read).
            3. Ask questions only if a design is technically not possible: the requirements
               contradict each other, they do not fit the existing code or CLAUDE.md, or access is missing.
               Do NOT ask functional questions that the issue already answers, and make
               smaller technical decisions yourself (document them in the architecture comment).
               If questions are needed: post them numbered with `gh issue comment`, create NO issues,
               and return status=needs_human.
            4. Otherwise create the issues in dependency order (so you can refer to real
               numbers). Each issue = exactly one pull request, small and testable on its own.
               Parallel pull requests that change the same files cause merge conflicts:
               if two issues change the same file, chain them with `Depends on #<number>`,
               even if they are independent in content.
               First write the body to a file with Write, then:
               `gh issue create --title "<title>" --body-file <file>`
               (WITHOUT --label – the workflow sets the labels.)
               Every body has these sections:
               - **Part of #${{ env.ISSUE }}**
               - **Goal**: 1–3 sentences
               - **Context**: relevant architecture decisions from your design
               - **Affected files**: concrete paths (new/change) and what happens there
               - **Interfaces**: function/class signatures, data structures, API endpoints
               - **Implementation steps**: numbered and concrete
               - **Acceptance criteria**: checkboxes, testable
               - **Tests**: which tests are written or changed
               - **Not part of this issue**: clear limits
               - for each dependency its own line, exactly: `Depends on #<number>`
               If a task really needs a human (secrets, access, a decision,
               a risky migration), create it anyway, with a section "What a human must do",
               and return it with class=human.
            5. Post a comment "## 🏗️ Architecture" in #${{ env.ISSUE }} with a short version of the
               design and a list of the created issues (number, title, dependencies).
            6. Return status=done and, in `created`, all issues with number and class:
               implement = can be done now, queued = has open dependencies, human = needs a human.
          claude_args: |
            --model opus
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),WebFetch(domain:learn.microsoft.com)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["done","needs_human"]},"created":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"class":{"type":"string","enum":["implement","queued","human"]}},"required":["number","class"]}},"reason":{"type":"string"}},"required":["status"]}'

      # ─────────────────────────────────────────────────────────────────
      # EVALUATION AFTER THE ARCHITECT RUN
      # Reads Claude's result (JSON in $RESULT) and then sets the labels.
      # Labels and starts are set on purpose by this fixed code, not by Claude itself.
      # So no issue stays without a label, even if Claude stops early.
      #
      # Expected result from Claude, e.g.:
      #   { "status": "done",
      #     "created": [ {"number": 20, "class": "implement"},
      #                  {"number": 21, "class": "queued"},
      #                  {"number": 22, "class": "human"} ] }
      #
      # Flow:
      #  1. No result (crash/timeout)?      → treat it as empty JSON {}.
      #  2. Read the status. Missing        → "failed".
      #  3. Remove the labels claude:in-progress and claude:auto-architect from the architect issue
      #     (so it can be set again for a restart).
      #  4. Status "needs_human"            → label needs-human, end.
      #     (Claude has already posted its questions as a comment.)
      #  5. Status not "done" OR no issues created
      #                                     → labels needs-human + claude:failed,
      #                                       comment with a link to the log, end.
      #  6. Sort every newly created issue:
      #       implement → label claude:auto-implement + start claude-implement.yml
      #       queued    → the same. claude-implement.yml checks the "Depends on #…"
      #                   itself and sets the issue to claude:queued while
      #                   predecessors are open (the unlock job starts it later).
      #                   So nothing gets stuck if Claude sorted it wrongly.
      #       human     → label needs-human (a human must do something)
      #  7. Everything sorted → close the architect issue.
      #     The work now lives on in the new issues (list in the architecture comment).
      #
      # Note: labels set by a workflow with GITHUB_TOKEN do not trigger
      # another workflow. So claude:auto-implement here is only
      # for display. Sonnet is started with "gh workflow run".
      # ─────────────────────────────────────────────────────────────────
      # always(): runs also on timeout/cancel, so no issue stays stuck on claude:in-progress.
      - name: Set labels and start implementation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$RESULT" ] && RESULT='{}'
          STATUS=$(jq -r '.status // "failed"' <<<"$RESULT")
          gh issue edit "$ISSUE" --remove-label "claude:in-progress,claude:auto-architect" || true

          if [ "$STATUS" = "needs_human" ]; then
            gh issue edit "$ISSUE" --add-label "needs-human"; exit 0
          fi
          if [ "$STATUS" != "done" ] || [ "$(jq '.created // [] | length' <<<"$RESULT")" -eq 0 ]; then
            gh issue edit "$ISSUE" --add-label "needs-human,claude:failed"
            gh issue comment "$ISSUE" --body "⚠️ Architecture not finished. Details: ${RUN_URL} – Restart: set the label \`claude:auto-architect\` again."
            exit 0
          fi

          jq -c '.created[]' <<<"$RESULT" | while read -r item; do
            n=$(jq -r .number <<<"$item"); c=$(jq -r .class <<<"$item")
            case "$c" in
              implement|queued)
                gh issue edit "$n" --add-label "claude:auto-implement"  # display only; triggers nothing
                gh workflow run claude-implement.yml -f issue_number="$n" ;;  # checks dependencies itself
              human)  gh issue edit "$n" --add-label "needs-human" ;;
            esac
          done

          gh issue close "$ISSUE" --reason completed \
            --comment "🏗️ Architecture finished – the work continues in the issues linked above."

  unlock:
    # Starts when an issue is closed or on a manual run
    if: github.event.action == 'closed' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-unlock
      cancel-in-progress: false
    permissions:
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Release waiting issues
        # ─────────────────────────────────────────────────────────────────
        # UNLOCK: RELEASE WAITING ISSUES
        # Checks all waiting issues: if their predecessors are done, Sonnet starts.
        #
        # Flow:
        #  1. Get all OPEN issues with the label claude:queued (max. 200).
        #  2. For each of them:
        #     a) Read the issue text and find all lines "Depends on #<number>"
        #        (case does not matter) → list of predecessor numbers.
        #     b) Check each predecessor: is it closed?
        #          - closed       → ok
        #          - open         → blocked
        #          - not readable (e.g. the number does not exist) → counts as open,
        #            so blocked
        #     c) No predecessor blocked?
        #          → remove label claude:queued, set claude:auto-implement
        #            (display only)
        #          → start Sonnet with "gh workflow run claude-implement.yml"
        #        Otherwise: do nothing, the issue keeps waiting.
        #
        # Good to know:
        #  - "Closed" counts as done, no matter why. A dropped
        #    predecessor issue also releases its successors.
        #  - A claude:queued issue WITHOUT a "Depends on" line is released at once.
        #  - An issue that points to a wrong or missing number
        #    waits forever. Then fix the line in the issue or set
        #    claude:auto-implement yourself.
        # ─────────────────────────────────────────────────────────────────
        run: |
          for n in $(gh issue list --label "claude:queued" --state open --limit 200 --json number --jq '.[].number'); do
            body=$(gh issue view "$n" --json body --jq .body)
            deps=$(grep -oiE 'depends on #[0-9]+' <<<"$body" | grep -oE '[0-9]+' || true)
            blocked=0
            for d in $deps; do
              state=$(gh issue view "$d" --json state --jq .state 2>/dev/null || echo OPEN)
              [ "$state" != "CLOSED" ] && blocked=1
            done
            if [ "$blocked" -eq 0 ]; then
              echo "Releasing #$n"
              gh issue edit "$n" --remove-label "claude:queued" --add-label "claude:auto-implement"
              gh workflow run claude-implement.yml -f issue_number="$n"
            fi
          done
