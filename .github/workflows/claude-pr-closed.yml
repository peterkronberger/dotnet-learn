# UPDATE PR STATUS: when a pull request from Claude is closed (with or without merge),
# the label claude:pr-open is removed from the related issue.
# Without a merge, the issue also gets needs-human and a comment with the next steps.
# (On merge, GitHub closes the issue itself through "Closes #…".)
name: Claude – PR closed

on:
  pull_request:
    types: [closed]

jobs:
  update-issue:
    # Only: branch from this repo + branch name "claude/issue-<number>"
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/issue-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGED: ${{ github.event.pull_request.merged }}
    steps:
      # ─────────────────────────────────────────────────────────────────
      # Flow:
      #  1. Read the issue number from the branch name (claude/issue-42 → 42).
      #  2. Remove the label claude:pr-open from the issue – always, merged or not,
      #     and whether the issue is open or already closed.
      #  3. Only if NOT merged and the issue is still open:
      #       → set needs-human + comment with a restart hint
      #
      # Note: the branch claude/issue-<N> stays. A restart through
      # the label claude:auto-implement keeps working on it. If Claude should
      # start from scratch, delete the branch in GitHub first.
      # ─────────────────────────────────────────────────────────────────
      - name: Update issue status
        run: |
          ISSUE="${HEAD_REF#claude/issue-}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "No issue number in branch '$HEAD_REF' – nothing to do."; exit 0
          fi
          state=$(gh issue view "$ISSUE" --json state --jq .state 2>/dev/null || echo MISSING)
          if [ "$state" = "MISSING" ]; then
            echo "Issue #$ISSUE not found – nothing to do."; exit 0
          fi

          # 2. PR is closed → "PR open" is no longer true
          gh issue edit "$ISSUE" --remove-label "claude:pr-open" || true

          # 3. Not merged and issue still open → a human must decide
          if [ "$MERGED" != "true" ] && [ "$state" = "OPEN" ]; then
            gh issue edit "$ISSUE" --add-label "needs-human" || true
            gh issue comment "$ISSUE" --body "ℹ️ Pull request #${PR_NUMBER} was closed without a merge. Please decide how to continue:
          - Implement it again: make the requirements in the issue more precise if needed, then set the label \`claude:auto-implement\`. If Claude should start from scratch, delete the branch \`${HEAD_REF}\` first.
          - No longer needed: close the issue."
          else
            echo "Issue #$ISSUE: claude:pr-open removed (merged=$MERGED, issue $state)."
          fi
