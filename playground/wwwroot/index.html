<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C#-Playground</title>
    <!-- Set to the sub-path of the site on deployment (see .github/workflows/pages.yml). -->
    <base href="/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/playground.css" />
</head>

<body>
    <div id="app">
        <p class="pg-loading">Lade .NET-Laufzeit …</p>
    </div>

    <div id="blazor-error-ui" role="alert">
        Beim Laden ist ein Fehler aufgetreten.
        <a href="" onclick="location.reload(); return false;">Neu laden</a>
    </div>

    <script>
        // Take over the theme of the embedding learning site (same origin).
        window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin) { return; }
            var data = event.data;
            if (data && data.type === 'theme' && (data.value === 'dark' || data.value === 'light')) {
                document.documentElement.setAttribute('data-theme', data.value);
            }
        });

        // Report the result to the embedding learning page (spike S7). Only to our own origin.
        window.pgBridge = {
            report: function (message) {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(message, window.location.origin);
                }
            },
            // Typed code and input for the page (so it can unload this runner and keep the state).
            // Edits are debounced; a change of the running flag is sent at once.
            reportState: function (id, code, stdin, running) {
                var message = { type: 'state', id: id, code: code, stdin: stdin, running: running };
                clearTimeout(window.pgBridge._stateTimer);
                if (running !== window.pgBridge._lastRunning) {
                    window.pgBridge._lastRunning = running;
                    window.pgBridge.report(message);
                } else {
                    window.pgBridge._stateTimer = setTimeout(function () { window.pgBridge.report(message); }, 300);
                }
            }
        };

        // Report the content height (of #app, not of the document) to the embedding page.
        (function () {
            if (!window.parent || window.parent === window) { return; }
            var app = document.getElementById('app');
            if (!app || typeof ResizeObserver === 'undefined') { return; }
            var id = null;
            var parts = window.location.hash.slice(1).split('&');
            for (var i = 0; i < parts.length; i++) {
                if (parts[i].indexOf('id=') === 0) {
                    try { id = decodeURIComponent(parts[i].slice(3)); } catch (e) { id = null; }
                    break;
                }
            }
            var lastHeight = -1;
            function post() {
                var height = Math.ceil(app.getBoundingClientRect().height);
                if (height === lastHeight) { return; }
                lastHeight = height;
                window.pgBridge.report({ type: 'resize', id: id, height: height });
            }
            new ResizeObserver(post).observe(app);
            post();
        })();

        // Editor comfort: Tab indents, Esc releases the focus, Ctrl/⌘+Enter runs the code.
        var tabTrapActive = true;
        document.addEventListener('keydown', function (event) {
            var target = event.target;
            if (!(target instanceof HTMLTextAreaElement) || target.id !== 'editor') { return; }

            if (event.key === 'Escape') {
                tabTrapActive = false;
            } else if (event.key === 'Tab' && !event.shiftKey && tabTrapActive) {
                event.preventDefault();
                document.execCommand('insertText', false, '    ');
            } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                var button = document.getElementById('run-button');
                if (button && !button.disabled) { button.click(); }
            } else if (event.key !== 'Tab' && event.key !== 'Shift') {
                tabTrapActive = true;
            }
        });
    </script>

    <script src="js/editor.js"></script>

    <!-- Deliberately without the placeholders of the fingerprint feature: without the project property
         OverrideHtmlAssetPlaceholders these placeholders are not replaced on publish. The browser
         then requests a file that does not exist and the app never starts. The file
         _framework/blazor.webassembly.js is served under this name
         (checked on the published site). -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
