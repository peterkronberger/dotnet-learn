<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C#-Playground</title>
    <!-- Set to the sub-path of the site on deployment (see .github/workflows/pages.yml). -->
    <base href="/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/playground.css" />
</head>

<body>
    <div id="app">
        <p class="pg-loading">Lade .NET-Laufzeit …</p>
    </div>

    <div id="blazor-error-ui" role="alert">
        Beim Laden ist ein Fehler aufgetreten.
        <a href="" onclick="location.reload(); return false;">Neu laden</a>
    </div>

    <script>
        // Take over the theme of the embedding learning site (same origin).
        window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin) { return; }
            var data = event.data;
            if (data && data.type === 'theme' && (data.value === 'dark' || data.value === 'light')) {
                document.documentElement.setAttribute('data-theme', data.value);
            }
        });

        // Report the result to the embedding learning page (spike S7). Only to our own origin.
        window.pgBridge = {
            report: function (message) {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(message, window.location.origin);
                }
            }
        };

        // Editor comfort: Tab indents, Esc releases the focus, Ctrl/⌘+Enter runs the code.
        var tabTrapActive = true;
        document.addEventListener('keydown', function (event) {
            var target = event.target;
            if (!(target instanceof HTMLTextAreaElement) || target.id !== 'editor') { return; }

            if (event.key === 'Escape') {
                tabTrapActive = false;
            } else if (event.key === 'Tab' && !event.shiftKey && tabTrapActive) {
                event.preventDefault();
                document.execCommand('insertText', false, '    ');
            } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                var button = document.getElementById('run-button');
                if (button && !button.disabled) { button.click(); }
            } else if (event.key !== 'Tab' && event.key !== 'Shift') {
                tabTrapActive = true;
            }
        });
    </script>

    <script src="js/editor.js"></script>

    <!-- Deliberately without the placeholders of the fingerprint feature: without the project property
         OverrideHtmlAssetPlaceholders these placeholders are not replaced on publish. The browser
         then requests a file that does not exist and the app never starts. The file
         _framework/blazor.webassembly.js is served under this name
         (checked on the published site). -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
